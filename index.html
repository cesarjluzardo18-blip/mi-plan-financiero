<style>

.search{position:relative;display:flex;align-items:center}
.search>svg{position:absolute;left:15px;width:19px;height:19px;color:var(--muted);pointer-events:none}

<div class="wrap">
  <header class="top"><div><div class="small" style="color:var(--accent);font-weight:600;letter-spacing:.04em" id="hello">Hola</div><h1>Mi Plan Financiero</h1></div><div style="display:flex;align-items:center;gap:10px"><span class="muted small" id="today"></span><button type="button" class="btn tiny" data-act="go-datos">⚙ Mis datos</button></div></header>

<script>
"use strict";
const PLACES=()=>{const c={};(S.expenses||[]).forEach(e=>{const p=(e.place||"").trim();if(p)c[p]=(c[p]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,30)};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const now=()=>new Date();
const ym=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const iso=d=>ym(d)+"-"+pad(d.getDate());
const parseISO=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c||1)};
const eur=(n,round)=>{const v=round?Math.round(n):n;return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",useGrouping:true,minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:Number.isInteger(v)?0:2}).format(v)};
const num=v=>{let s=String(v??"").trim().replace(/\s|€/g,"");if(!s)return null;if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return Number.isFinite(n)?n:null};
const dShort=d=>d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(".","");
const dLong=d=>d.toLocaleDateString("es-ES",{day:"numeric",month:"long",year:"numeric"});
const mLong=d=>d.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
const dim=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
const daysTo=d=>{const a=now();return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate()))/864e5)};
const whenTxt=n=>n===0?"hoy":n===1?"mañana":n<0?`hace ${-n} días`:`en ${n} días`;
const BASE_CATS=["Deudas","Imprevistos","Otros"];
const extraCats=()=>{const s=(S.settings[0]||{}).extraCats;const own=String(s||"").split(",").map(x=>x.trim()).filter(Boolean);const used=S.expenses.map(e=>e.cat).filter(Boolean);const bud=S.recurring.filter(r=>r.type==="presupuesto").map(r=>r.name);return [...new Set([...own,...BASE_CATS,...used])].filter(c=>!bud.includes(c))};
const partner=()=>String((S.settings[0]||{}).partner||"").trim();

const WD=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const nthWd=(y,mo,n,wd)=>{const f=new Date(y,mo,1),first=1+((wd-f.getDay()+7)%7),last=new Date(y,mo+1,0).getDate();if(n===-1){let d=first;while(d+7<=last)d+=7;return new Date(y,mo,d)}return new Date(y,mo,first+(n-1)*7)};
const payPlan=()=>setts().payPlan||[];
const payMode=()=>setts().payMode||"nsemana";
const payWd=()=>{const w=setts().payWd;return w==null||w===""?6:Number(w)};
const ORD=n=>n===-1?"Último":["Primer","Segundo","Tercer","Cuarto"][n-1];
function payDates(y,mo){
  const md=payMode(),wd=payWd(),last=new Date(y,mo+1,0).getDate(),out=[];
  if(md==="semanal"){const a=(payPlan()[0]||{}).amount||0;if(a){let d=nthWd(y,mo,1,wd);while(d.getMonth()===mo){out.push({date:d,amount:a});d=new Date(y,mo,d.getDate()+7)}}}
  else if(md==="nsemana")payPlan().filter(p=>p.n).forEach(p=>out.push({date:nthWd(y,mo,Number(p.n),wd),amount:p.amount||0}));
  else payPlan().filter(p=>p.day).forEach(p=>out.push({date:new Date(y,mo,Math.min(Number(p.day),last)),amount:p.amount||0}));
  return out.sort((a,b)=>a.date-b.date);
}
const monthIncome=()=>payPlan().length?payDates(now().getFullYear(),now().getMonth()).reduce((a,p)=>a+p.amount,0):(setts().income||0);
function payDesc(){
  const md=payMode(),w=WD[payWd()],pl=payPlan();if(!pl.length)return"";
  if(md==="semanal")return`Cada ${w}: <strong>${eur((pl[0]||{}).amount||0)}</strong>`;
  if(md==="nsemana")return pl.filter(p=>p.n).map(p=>`${ORD(Number(p.n))} ${w}: <strong>${eur(p.amount||0)}</strong>`).join("<br>");
  return pl.filter(p=>p.day).map(p=>`${Number(p.day)>=31?"Último día":"Día "+Number(p.day)}: <strong>${eur(p.amount||0)}</strong>`).join("<br>");
}
const MODES=[["mensual","Una vez al mes"],["quincenal","Dos veces al mes (quincenal)"],["semanal","Cada semana"],["nsemana","Algunas semanas del mes (ej.: 1.º y 3.º sábado)"],["dias","Días concretos que yo elijo"]];

    else for(let k=0;k<4;k++)if(v["d"+k])plan.push({day:day(v["d"+k]),amount:v["a"+k]||0});
    const wd=v.wd!=null&&v.wd!==""?Number(v.wd):payWd();

  },null,"Así la app sabe cuándo te entra el dinero y te avisa de lo que se cobra antes. Si cada mes cobras distinto, pon lo normal y luego anota en Ingresos lo que cobres de verdad.");

function nextPay(){const t=now();for(let k=0;k<3;k++){const x=new Date(t.getFullYear(),t.getMonth()+k,1),hit=payDates(x.getFullYear(),x.getMonth()).find(p=>daysTo(p.date)>0);if(hit)return hit}return null}
const begun=r=>!(r.start&&r.start>ym(now()));
const active=()=>S.recurring.filter(r=>r.active!==false&&begun(r));
const budgets=()=>active().filter(r=>r.type==="presupuesto");
const monthExp=m=>S.expenses.filter(e=>(e.date||"").startsWith(m));
function month(){
  const m=ym(now()),expected=monthIncome(),got=S.incomes.filter(i=>(i.date||"").startsWith(m)),gotSum=got.reduce((a,i)=>a+(i.amount||0),0),toCome=payDates(now().getFullYear(),now().getMonth()).filter(p=>daysTo(p.date)>0).reduce((a,p)=>a+p.amount,0),inc=got.length?gotSum+toCome:expected,commit=active().reduce((a,r)=>a+(r.amount||0),0);
  const exp=monthExp(m),bud=budgets();let extra=0;
  const spent=c=>exp.filter(e=>e.cat===c).reduce((a,e)=>a+e.amount,0);
  bud.forEach(b=>extra+=Math.max(0,spent(b.name)-b.amount));
  S.savings.filter(x=>x.who==="Yo"&&x.amount>0&&(x.date||"").startsWith(m)).forEach(x=>extra+=x.amount);
  exp.filter(e=>!bud.some(b=>b.name===e.cat)).forEach(e=>extra+=e.amount);
  const ending=active().filter(r=>r.ending).reduce((a,r)=>a+(r.amount||0),0);
  const planFree=expected-active().filter(r=>!r.ending).reduce((a,r)=>a+(r.amount||0),0);
  return{inc,expected,gotSum,toCome,registered:got.length>0,ending,commit,extra,libre:inc-commit-extra,planFree,spent,total:exp.reduce((a,e)=>a+e.amount,0)};
}
function charges(){
  const t=now(),m=ym(t),out=[];
  S.recurring.filter(r=>r.active!==false&&r.type==="cobro"&&r.day).forEach(r=>{
    let d=new Date(t.getFullYear(),t.getMonth(),Math.min(r.day,dim(t)));
    const paid=(r.paid||[]).includes(m);
    if(paid||daysTo(d)<0){const x=new Date(t.getFullYear(),t.getMonth()+1,1);d=new Date(x.getFullYear(),x.getMonth(),Math.min(r.day,dim(x)))}
    if(r.start&&ym(d)<r.start){const s=parseISO(r.start+"-01");d=new Date(s.getFullYear(),s.getMonth(),Math.min(r.day,dim(s)))}
    out.push({r,d,n:daysTo(d)});
  });
  return out.sort((a,b)=>a.d-b.d||a.r.name.localeCompare(b.r.name));
}
function simulate(extra,pauseUntil){
  const cards=S.debts.filter(d=>d.kind==="card").map(d=>({...d,b:d.balance||0})).sort((a,b)=>b.tae-a.tae);
  if(!cards.length)return null;
  const fees=cards.reduce((a,c)=>a+(c.fee||0),0);let t=0,interest=0;const base=new Date(now().getFullYear(),now().getMonth(),1);
  while(cards.some(c=>c.b>.01)&&t<600){
    t++;const key=ym(new Date(base.getFullYear(),base.getMonth()+t,1));
    let pool=fees+((pauseUntil&&key<=pauseUntil)?0:(extra||0));
    cards.forEach(c=>{const i=c.b*(Math.pow(1+c.tae/100,1/12)-1);interest+=i;c.b+=i});
    const live=cards.filter(c=>c.b>.01);
    live.slice(1).forEach(c=>{const p=Math.min(c.b,c.fee||0);c.b-=p;pool-=p});
    live.forEach(c=>{const p=Math.min(c.b,pool);c.b-=p;pool-=p});
    if(fees+(extra||0)<=0)return{never:true};
  }
  if(t>=600)return{never:true};
  return{months:t,interest,end:new Date(base.getFullYear(),base.getMonth()+t,1)};
}
function plan(){
  const free=Math.max(0,month().planFree),rescue=setts().rescue||0,base=new Date(now().getFullYear(),now().getMonth(),1);
  const items=S.upcoming.filter(u=>!u.done&&!u.task).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  let need=0;const rows=items.map(u=>{
    const d=parseISO(u.date),mths=Math.max(0,(d.getFullYear()-base.getFullYear())*12+d.getMonth()-base.getMonth());
    need+=Math.max(0,(u.amount||0)-(u.saved||0));
    const avail=rescue+free*mths;
    return{u,d,need,avail,gap:Math.max(0,need-avail)};
  });
  return{rows,free,rescue,total:need,gap:rows.reduce((a,r)=>Math.max(a,r.gap),0),missing:items.filter(u=>u.amount==null).length,last:rows.length?rows[rows.length-1].d:null};
}

function openForm(title,fields,onSave,onDelete,note){
  const dlg=$("#dlg");
  const f=x=>{
    const id="f-"+x.id,v=x.value??"";
    if(x.type==="check")return`<label class="c" for="${id}"><input id="${id}" type="checkbox" ${v?"checked":""}>${esc(x.label)}</label>`;
    const hint=x.hint?`<span class="hint">${esc(x.hint)}</span>`:"";
    if(x.type==="select")return`<label class="f" for="${id}">${esc(x.label)}<select id="${id}">${x.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>${hint}</label>`;
    const t=x.type==="date"?"date":x.type==="month"?"month":"text";
    const im=x.type==="money"||x.type==="int"?` inputmode="${x.type==="int"?"numeric":"decimal"}"`:"";
    const shown=x.type==="money"&&v!==""?String(v).replace(".",","):v;
    return`<label class="f" for="${id}">${esc(x.label)}<input id="${id}" type="${t}"${im} value="${esc(shown)}" ${x.required?"required":""}${x.list?` list="${id}-l"`:""}>${x.list?`<datalist id="${id}-l">${x.list.map(o=>`<option value="${esc(o)}"></option>`).join("")}</datalist>`:""}${hint}</label>`;
  };
  dlg.innerHTML=`<form method="dialog" id="dlg-form" class="grid"><h2>${esc(title)}</h2>${note?`<p class="small muted">${esc(note)}</p>`:""}<div class="fields">${fields.map(f).join("")}</div><div class="actions">${onDelete?'<button type="button" class="btn danger left" id="dlg-del">Eliminar</button>':""}<button type="button" class="btn" id="dlg-x">Cancelar</button><button type="submit" class="btn primary">Guardar</button></div></form>`;
  $("#dlg-x").onclick=()=>dlg.close();
  if(onDelete){const b=$("#dlg-del");b.onclick=()=>{if(b.dataset.sure){dlg.close();onDelete()}else{b.dataset.sure="1";b.textContent="Confirmar: eliminar"}}}
  $("#dlg-form").onsubmit=e=>{
    e.preventDefault();const out={};
    for(const x of fields){const el=$("#f-"+x.id);
      if(x.type==="check")out[x.id]=el.checked;
      else if(x.type==="money"||x.type==="int"){const n=num(el.value);if(el.value.trim()&&n==null){el.setCustomValidity("Escribe un número, por ejemplo 12,50");el.reportValidity();el.oninput=()=>el.setCustomValidity("");return}out[x.id]=n}
      else out[x.id]=el.value.trim();
    }
    dlg.close();onSave(out);
  };
  dlg.showModal();
}

function closing(m){

  const cob=S.recurring.filter(r=>r.type==="cobro"),paidL=cob.filter(r=>(r.paid||[]).includes(m));
  const paid=paidL.reduce((a,r)=>a+(r.amount||0),0),unpaid=cob.filter(r=>r.active!==false&&r.day&&!(r.paid||[]).includes(m)).length;
  const exp=monthExp(m).reduce((a,e)=>a+(e.amount||0),0);

  return{m,inc,paid,exp,sav,unpaid,res:inc-paid-exp-sav,has:inc>0||paidL.length>0||exp>0};
}

function ledger(){
  const t=now(),m=ym(t),y=t.getFullYear(),mo=t.getMonth(),days=dim(t),ev=[];
  const incs=S.incomes.filter(i=>(i.date||"").startsWith(m));

  const exps=monthExp(m);exps.forEach(e=>ev.push({d:parseISO(e.date),amt:-(e.amount||0),label:e.concept}));

  const byDay=new Map();ev.sort((a,b)=>a.d-b.d).forEach(e=>{const k=e.d.getDate();if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(e)});
  let run=0;const rows=[];
  for(const [k,list] of byDay){const sum=list.reduce((a,e)=>a+e.amt,0);run+=sum;rows.push({day:k,d:list[0].d,list,sum,run})}
  const pend=cob.filter(r=>!isPaid(r)).map(r=>({id:r.id,name:r.name+lastOf(r.id),amount:r.amount||0,day:r.day?Math.min(r.day,days):null})).sort((a,b)=>(a.day||99)-(b.day||99));

const photoCat=()=>String(setts().photoCat||"");
const capFirst=t=>t?t[0].toUpperCase()+t.slice(1):t;

function compressImage(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      let max=1400,q=.72,out="";
      for(let k=0;k<6;k++){
        const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
        out=cv.toDataURL("image/jpeg",q);if(out.length<850000)break;max=Math.round(max*.8);q=Math.max(.5,q-.06);
      }
      URL.revokeObjectURL(url);out.length<1000000?res(out):rej(new Error("grande"));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("formato"))};
    img.src=url;
  });
}

/* Avisos (notificaciones) */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(_){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(_){}};
const pushOn=()=>"Notification" in window&&Notification.permission==="granted"&&!!lsGet("pushToken");
function info(title,text){const dlg=$("#dlg");dlg.innerHTML=`<form method="dialog" class="grid"><h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn primary">Entendido</button></div></form>`;dlg.showModal()}
async function enablePush(){
  const ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
  if(ios&&!standalone){info("Primero, añádela a tu pantalla de inicio","En iPhone los avisos solo funcionan si la app está en la pantalla de inicio. En Safari pulsa el botón Compartir (el cuadrado con la flecha) → «Añadir a pantalla de inicio». Luego ábrela desde ese icono, entra en Mis datos y vuelve a pulsar «Activar avisos».");return}
  let sup=false;try{sup="Notification" in window&&"serviceWorker" in navigator&&!!firebase.messaging&&await Promise.resolve(firebase.messaging.isSupported())}catch(_){}
  if(!sup){info("Este navegador no admite avisos","Prueba desde la app instalada en tu móvil, o con Chrome o Edge en el ordenador.");return}
  if(!window.VAPID_KEY){info("Falta un paso de configuración","Los avisos aún no están conectados con Firebase (falta la clave de notificaciones).");return}
  const perm=await Notification.requestPermission();
  if(perm!=="granted"){info("No se dio permiso","Para activarlos: Ajustes del iPhone → Notificaciones → Mi Plan → Permitir notificaciones. Luego vuelve a pulsar «Activar avisos».");return}
  save(async()=>{
    const reg=await navigator.serviceWorker.register("sw.js");await navigator.serviceWorker.ready;
    const token=await firebase.messaging().getToken({vapidKey:window.VAPID_KEY,serviceWorkerRegistration:reg});
    if(!token)throw new Error("sin token");
    const old=lsGet("pushToken");
    await db.collection("tokens").doc(token).set({token,device:navigator.userAgent.slice(0,160),created:new Date().toISOString()});
    if(old&&old!==token){try{await db.collection("tokens").doc(old).delete()}catch(_){}}
    lsSet("pushToken",token);render();
  },"Avisos activados en este dispositivo");
}

/* Copias de seguridad */
function doBackup(){
  const data={};COLS.forEach(c=>{data[c]={};S[c].forEach(({id,...rest})=>data[c][id]=rest)});
  const blob=new Blob([JSON.stringify({app:"mi-plan-financiero",version:1,exported:new Date().toISOString(),data},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`mi-plan-financiero-${iso(now())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  toast("Copia descargada");
}
$("#imp").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f||!db)return;
  let j;try{j=JSON.parse(await f.text())}catch(_){toast("Ese archivo no es una copia válida");return}
  const data=j&&j.data;if(!data||typeof data!=="object"){toast("Ese archivo no es una copia válida");return}
  const n=COLS.reduce((a,c)=>a+Object.keys(data[c]||{}).length,0);
  if(!n){toast("La copia está vacía");return}
  if(!confirm(`Se van a importar ${n} registros. Los que ya existan con el mismo identificador se sustituyen. ¿Seguir?`))return;
  save(async()=>{
    let b=db.batch(),k=0;
    for(const c of COLS)for(const [id,doc] of Object.entries(data[c]||{})){b.set(db.collection(c).doc(id),doc);if(++k%400===0){await b.commit();b=db.batch()}}
    await b.commit();
  },`Importados ${n} registros`);
});

/* Inicio de sesión */
let mode="in";
const AUTH_ERR={"auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Correo o contraseña incorrectos.","auth/user-not-found":"No hay ninguna cuenta con ese correo.","auth/invalid-email":"Ese correo no es válido.","auth/email-already-in-use":"Ya existe una cuenta con ese correo. Pulsa Entrar.","auth/weak-password":"La contraseña debe tener al menos 6 caracteres.","auth/too-many-requests":"Demasiados intentos. Espera unos minutos.","auth/network-request-failed":"Sin conexión. Revisa tu internet.","auth/operation-not-allowed":"El inicio de sesión con correo no está activado en Firebase.","auth/admin-restricted-operation":"La creación de cuentas nuevas está desactivada."};
function lmsg(t,ok){const m=$("#l-msg");m.textContent=t||"";m.hidden=!t;m.className=ok?"ok":"err"}
function setMode(m){mode=m;const up=m==="up";$("#l-title").textContent=up?"Crear cuenta":"Entrar";$("#l-go").textContent=up?"Crear cuenta":"Entrar";$("#l-mode").textContent=up?"Ya tengo cuenta. Entrar":"¿Primera vez? Crear cuenta";$("#l-pass2-w").hidden=!up;$("#l-pass2").required=up;$("#l-pass").autocomplete=up?"new-password":"current-password";$("#l-forgot").hidden=up;lmsg("")}
$("#l-mode").onclick=()=>setMode(mode==="up"?"in":"up");

let auth=null,fs=null,unsubs=[],timer=null;
function stopData(){unsubs.forEach(u=>u());unsubs=[];clearTimeout(timer);COLS.forEach(c=>{S[c]=[];delete loaded[c]});db=null}
function showLogin(on){$("#login").hidden=!on;document.querySelector(".wrap").hidden=on;document.querySelector("nav").hidden=on}

render();
(()=>{
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||String(cfg.apiKey).startsWith("PEGA")){$("#status").textContent="Falta conectar la app con Firebase. Revisa el archivo config.js.";return}
  firebase.initializeApp(cfg);auth=firebase.auth();auth.languageCode="es";fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(_){}
  $("#login-form").addEventListener("submit",async e=>{
    e.preventDefault();const em=$("#l-email").value.trim(),pw=$("#l-pass").value;lmsg("");
    if(mode==="up"&&pw!==$("#l-pass2").value){lmsg("Las contraseñas no coinciden.");return}
    const b=$("#l-go");b.disabled=true;
    try{mode==="up"?await auth.createUserWithEmailAndPassword(em,pw):await auth.signInWithEmailAndPassword(em,pw)}
    catch(err){lmsg(AUTH_ERR[err.code]||"No se pudo entrar. Inténtalo otra vez.")}
    finally{b.disabled=false}
  });
  $("#l-forgot").onclick=async()=>{const em=$("#l-email").value.trim();if(!em){lmsg("Escribe tu correo arriba y vuelve a pulsar.");$("#l-email").focus();return}
    try{await auth.sendPasswordResetEmail(em);lmsg("Te hemos enviado un correo para cambiar la contraseña. Mira también en spam.",true)}catch(err){lmsg(AUTH_ERR[err.code]||"No se pudo enviar el correo.")}};
  auth.onAuthStateChanged(u=>{
    stopData();
    if(!u){showLogin(true);return}
    showLogin(false);$("#l-pass").value="";$("#l-pass2").value="";
    $("#status").hidden=false;$("#status").textContent="Cargando tus cuentas…";
    const base=fs.collection("users").doc(u.uid);
    db={collection:c=>base.collection(c),batch:()=>fs.batch(),email:u.email};
    timer=setTimeout(()=>{if(!COLS.every(c=>loaded[c]))$("#status").textContent="Aún no llegan tus datos. Revisa tu conexión; seguirá intentándolo."},10000);
    COLS.forEach(c=>unsubs.push(db.collection(c).onSnapshot({includeMetadataChanges:true},sn=>{
      S[c]=sn.docs.map(d=>({...d.data(),id:d.id}));
      if(!sn.metadata.fromCache||sn.size||!navigator.onLine)loaded[c]=true;
      if(COLS.every(x=>loaded[x]))clearTimeout(timer);
      if(!$("#dlg").open)render();
    },()=>{loaded[c]=true;clearTimeout(timer);$("#status").hidden=false;$("#status").textContent="No se pudieron cargar tus datos. Comprueba las reglas de Firestore o vuelve a entrar."})));
  });
  $("#dlg").addEventListener("close",render);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>

</body></html>
